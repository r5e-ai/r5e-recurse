image: hexpm/elixir:1.19.5-erlang-28.5-debian-bookworm-20260421

variables:
  MIX_ENV: test

cache:
  key:
    files:
      - mix.lock
  paths:
    - deps/
    - _build/

verify:
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 build-essential
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --check-locked
  script:
    - mix format --check-formatted
    - mix compile --warnings-as-errors
    - mix test --exclude live --exclude perf
    - python3 test/fixtures/procs/native_protocol_test.py priv/launcher/r5e_launch
    - cc -std=c11 -Wall -Wextra -Werror -DR5E_LAUNCH_TEST -O2 -o /tmp/r5e-launch-fault priv/launcher/r5e_launch.c
    - python3 test/fixtures/procs/startup_fault_test.py /tmp/r5e-launch-fault
