image: hexpm/elixir:1.19.5-erlang-28.5-debian-bookworm-20260421

variables:
  MIX_ENV: test

cache:
  key:
    files:
      - mix.lock
  paths:
    - deps/
    - _build/

verify:
  before_script:
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --check-locked
  script:
    - mix format --check-formatted
    - mix compile --warnings-as-errors
    - mix test --exclude live --exclude perf
